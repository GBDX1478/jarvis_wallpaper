name: api-test
on:
  push:
    branches: [api-test]
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36"
          echo "== spark"; curl -s -A "$UA" "https://query1.finance.yahoo.com/v7/finance/spark?symbols=%5EFCHI,%5EGSPC,%5EIXIC&range=1d&interval=1d" | head -c 900; echo
          sleep 5
          echo "== spark8"; curl -s -A "$UA" "https://query1.finance.yahoo.com/v8/finance/spark?symbols=%5EFCHI,%5EGSPC,%5EIXIC&range=1d&interval=1d" | head -c 900; echo
          for s in %5EFCHI %5EGSPC %5EIXIC; do sleep 4; echo "== chart slow $s"; curl -s -A "$UA" "https://query2.finance.yahoo.com/v8/finance/chart/$s?range=1d&interval=1d" | head -c 300; echo; done
          echo "== frankfurter series"; curl -sL "https://api.frankfurter.dev/v1/2026-11-06..?base=EUR&symbols=USD,JPY"; echo
          echo "== cnbc"; curl -s -A "$UA" "https://quote.cnbc.com/quote-html-webservice/restQuote/symbolType/symbol?symbols=.FCHI%7C.SPX%7C.IXIC&requestMethod=itv&noform=1&partnerId=2&fund=1&exthrs=1&output=json" | head -c 900; echo
